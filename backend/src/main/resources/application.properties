spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/moneydb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Cloud@123$

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

backend.jwtSecret=BLUEYONDERBELLANDURBENGALURUBLUEYONDERBELLANDURBENGALURUBLUEYONDERBELLANDURUBENGALURUBLUEYONDERBELLANDURBENGALURUBENGALURUBLUEYONDERBELLANDURBENGALURU
backend.jwtExpirationMs=86400000

logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG
